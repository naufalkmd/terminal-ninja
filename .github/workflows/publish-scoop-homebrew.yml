name: Publish Scoop And Homebrew

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string
      create_release:
        description: Create the tag and GitHub Release from the selected branch before publishing
        required: false
        default: true
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.context.outputs.owner }}
      repo: ${{ steps.context.outputs.repo }}
      tag: ${{ steps.context.outputs.tag }}
    steps:
      - name: Resolve publish context
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [ -z "$tag" ]; then
            echo "::error::No release tag was provided."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "owner=${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for manual release preparation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create missing tag from selected branch
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: bash
        env:
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Verify requested tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          git fetch --tags origin
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG does not exist. Enable create_release or push the tag first."
            exit 1
          fi

      - name: Create GitHub Release if needed
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.context.outputs.tag }}
        run: |
          release_url="https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG"
          status="$(curl -sS -o release-response.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$release_url")"

          if [ "$status" = "200" ]; then
            echo "Release for $TAG already exists."
            exit 0
          fi

          if [ "$status" != "404" ]; then
            cat release-response.json
            echo "::error::Failed to check whether the release for $TAG already exists."
            exit 1
          fi

          payload="$(printf '{"tag_name":"%s","name":"%s","generate_release_notes":true}' "$TAG" "$TAG")"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" \
            "https://api.github.com/repos/$REPOSITORY/releases"

  render:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      version: ${{ steps.render.outputs.version }}
      tag: ${{ steps.render.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Render Homebrew formula and Scoop manifest
        id: render
        env:
          RELEASE_OWNER: ${{ needs.prepare.outputs.owner }}
          RELEASE_REPO: ${{ needs.prepare.outputs.repo }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python .github/scripts/render_package_manager_assets.py

      - name: Upload generated package manager assets
        uses: actions/upload-artifact@v6
        with:
          name: package-manager-assets
          path: dist-package-managers/

  publish-homebrew:
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Resolve Homebrew publish config
        id: config
        shell: bash
        env:
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          HOMEBREW_FORMULA_PATH: ${{ vars.HOMEBREW_FORMULA_PATH }}
          PACKAGE_REPO_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_REPO" ] && [ -n "$PACKAGE_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "repository=$HOMEBREW_TAP_REPO" >> "$GITHUB_OUTPUT"
            if [ -n "$HOMEBREW_FORMULA_PATH" ]; then
              echo "formula_path=$HOMEBREW_FORMULA_PATH" >> "$GITHUB_OUTPUT"
            else
              echo "formula_path=Formula/terminalninja.rb" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "formula_path=Formula/terminalninja.rb" >> "$GITHUB_OUTPUT"
          fi

      - name: Download generated assets
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v6
        with:
          name: package-manager-assets
          path: dist-package-managers

      - name: Checkout Homebrew tap
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.config.outputs.repository }}
          token: ${{ secrets.PACKAGE_REPO_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          FORMULA_PATH: ${{ steps.config.outputs.formula_path }}
        run: |
          mkdir -p "tap/$(dirname "$FORMULA_PATH")"
          cp dist-package-managers/terminalninja.rb "tap/$FORMULA_PATH"

      - name: Commit and push formula update
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        working-directory: tap
        env:
          RELEASE_TAG: ${{ needs.render.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Homebrew changes to commit."
            exit 0
          fi
          git commit -m "Update terminalninja $RELEASE_TAG"
          git push

      - name: Skip Homebrew publish
        if: steps.config.outputs.enabled != 'true'
        run: echo "Homebrew publish skipped because HOMEBREW_TAP_REPO or PACKAGE_REPO_TOKEN is not configured."

  publish-scoop:
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Resolve Scoop publish config
        id: config
        shell: bash
        env:
          SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
          SCOOP_MANIFEST_PATH: ${{ vars.SCOOP_MANIFEST_PATH }}
          PACKAGE_REPO_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
        run: |
          if [ -n "$SCOOP_BUCKET_REPO" ] && [ -n "$PACKAGE_REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "repository=$SCOOP_BUCKET_REPO" >> "$GITHUB_OUTPUT"
            if [ -n "$SCOOP_MANIFEST_PATH" ]; then
              echo "manifest_path=$SCOOP_MANIFEST_PATH" >> "$GITHUB_OUTPUT"
            else
              echo "manifest_path=bucket/terminalninja.json" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "manifest_path=bucket/terminalninja.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Download generated assets
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v6
        with:
          name: package-manager-assets
          path: dist-package-managers

      - name: Checkout Scoop bucket
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.config.outputs.repository }}
          token: ${{ secrets.PACKAGE_REPO_TOKEN }}
          path: bucket

      - name: Update Scoop manifest
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.config.outputs.manifest_path }}
        run: |
          mkdir -p "bucket/$(dirname "$MANIFEST_PATH")"
          cp dist-package-managers/terminalninja.json "bucket/$MANIFEST_PATH"

      - name: Commit and push manifest update
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        working-directory: bucket
        env:
          RELEASE_TAG: ${{ needs.render.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Scoop changes to commit."
            exit 0
          fi
          git commit -m "Update terminalninja $RELEASE_TAG"
          git push

      - name: Skip Scoop publish
        if: steps.config.outputs.enabled != 'true'
        run: echo "Scoop publish skipped because SCOOP_BUCKET_REPO or PACKAGE_REPO_TOKEN is not configured."
